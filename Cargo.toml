[package]
name = "llm-streamliner"
version = "0.1.0"
edition = "2021"

[features]
default = []
gzip = ["flate2/gzip"]
lz4 = ["lz4_flex"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
flate2 = { version = "1.0", features = ["zlib"] }
lz4_flex = { version = "0.11", optional = true, features = ["frame"] }
tempfile = "3.3"  # For storage tests
